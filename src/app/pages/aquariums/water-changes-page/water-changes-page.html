<div class="p-2">
  <nav class="flex justify-end mb-2 gap-1">
    <button hlmBtn size="sm" variant="success">
      <ng-icon name="lucidePlus" />
      Dodaj podmianę
    </button>
    <refresh-list-button
      (onRefresh)="refreshList()"
      [isRefreshing]="waterChangesList.status() === 'loading'"
    />
  </nav>

  <data-table
    [records]="waterChangeRecords"
    [columns]="waterChangeColumns"
    [paginationStore]="paginationStore"
    [rowActions]="actionsMenu"
  />

  <ng-template #actionsMenu let-row>
    <div hlmDropdownMenu class="w-48">
      <button
        hlmDropdownMenuItem
        (click)="
          deleteDialogCmp.openWithIdAndNameAddition(
            row.id,
            `w akwarium &quot;${row.aquariumName}&quot; z dnia ${row.changeDate}`
          )
        "
        variant="destructive"
      >
        <ng-icon name="lucideTrash2" />
        Usuń
      </button>
    </div>
  </ng-template>

  <div class="mt-3"></div>
  <pagination
    [paginationState]="paginationStore.state"
    (pageChange)="paginationStore.setPage($event)"
    (pageSizeChange)="paginationStore.setPageSize($event)"
  />
</div>

<delete-confirm-dialog
  #deleteDialogCmp
  elementName="Podmianę wody"
  (onConfirm)="onDelete($event || '')"
/>
