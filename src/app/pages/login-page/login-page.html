<div class="h-screen flex items-center justify-center bg-gray-100">
  <hlm-card
    class="w-90 sm:w-[50%] lg:justify-center lg:items-center lg:grid lg:grid-cols-2 lg:gap-4 shadow-lg p-0!"
  >
    <div class="bg-primary h-full hidden lg:flex flex-col justify-center px-3">
      <h1 class="text-white text-3xl font-bold text-center pt-8">Home Server</h1>
      <p class="text-gray-100 text-md font-medium text-lg text-center mt-1">
        System zarządzania danymi domowymi
      </p>
      <span class="text-gray-400 text-center mt-auto mb-0.5">&copy; Rafał Waremczuk 2026</span>
    </div>
    <div class="md:border-r p-10! lg:p-3">
      <h1 class="font-bold text-3xl text-center text-primary lg:hidden mb-1">Home server</h1>
      <h1 class="font-bold text-2xl text-center text-secondary lg:text-primary">Zaloguj się</h1>
      <form [formGroup]="loginForm" (ngSubmit)="login()">
        <hlm-field-group>
          <hlm-field>
            <label hlmFieldLabel for="login">Login</label>
            <input
              hlmInput
              id="login"
              formControlName="login"
              placeholder="Nazwa użytkownika"
              autocomplete="username"
            />
            <error-label
              [isDisabled]="loginForm.controls.login.invalid && loginForm.controls.login.touched"
              message="Login jest wymagany!"
            ></error-label>
          </hlm-field>
          <hlm-field>
            <label hlmFieldLabel for="password">Hasło</label>
            <input
              hlmInput
              id="password"
              formControlName="password"
              type="password"
              placeholder="***********"
            />
            <error-label
              [isDisabled]="
                loginForm.controls.password.invalid && loginForm.controls.password.touched
              "
              message="Hasło jest wymagane!"
            ></error-label>
          </hlm-field>
          <hlm-field orientation="horizontal" class="flex w-full items-center justify-center">
            <button
              hlmBtn
              type="submit"
              [disabled]="loginForm.invalid && loginForm.touched"
              class="px-8 self-center mt-auto"
            >
              Zaloguj
            </button>
          </hlm-field>
        </hlm-field-group>
      </form>
    </div>
  </hlm-card>
</div>
