<header
  class="py-2.5 ps-5 pe-4 bg-white border-b border-gray-300 flex flex-wrap items-center justify-between gap-3 shadow-2xs"
>
  <div>
    <h2 class="font-bold text-2xl text-primary flex items-center gap-2">
      <ng-icon name="tablerCalendarEvent" class="text-primary" />
      Wydarzenia
    </h2>
  </div>
  <div class="flex items-center gap-2">
    <button
      hlmBtn
      variant="success"
      class="flex items-center gap-1.5 text-xs font-semibold px-3 py-2"
      (click)="createEditDialogCmp.openCreate()"
    >
      <ng-icon name="lucidePlus" class="text-base" />
      <span>Dodaj wydarzenie</span>
    </button>
    <refresh-list-button
      (onRefresh)="refreshList()"
      [isRefreshing]="eventsResource.status() === 'loading'"
    />
  </div>
</header>

<div class="bg-white px-2 py-2 flex items-center flex-wrap gap-2">
  <span class="text-muted-foreground">Filtry</span>
  <filter-search-input
    fieldName="title"
    [value]="this.filters().title"
    placeholder="Szukaj po tytule..."
    (onValueChange)="setFilter('title', $event)"
  />
  <form-select
    [items]="eventCategorySelectOptions"
    [isLoading]="false"
    placeholder="Kategoria..."
    [value]="this.filters().category"
    (onSelection)="onCategorySelect($event)"
  />

  <span class="text-muted-foreground text-sm font-medium">Status</span>

  <form-select
    [items]="eventCompletionSelectOptions"
    [isLoading]="false"
    placeholder="Status zakończenia"
    [value]="this.filters().isCompleted"
    (onSelection)="onCompletionSelect($event)"
  />

  <!-- Date filters -->
  <hlm-popover>
    <button hlmBtn variant="outline" hlmPopoverTrigger>
      Filtry dat
      @if (isDateFilterActive()) {
        <ng-icon name="lucideCheck" class="text-primary" />
      }
    </button>
    <div hlmPopoverContent *hlmPopoverPortal="let ctx" class="w-64 p-3 flex flex-col gap-2">
      <span class="font-semibold text-primary text-sm">Data wydarzenia</span>
      <div class="w-58 flex flex-col gap-1">
        <span class="text-xs text-muted-foreground">Od</span>
        <form-date-picker
          placeholder="Od"
          [value]="this.filters().fromDate"
          (onSelection)="setFilter('fromDate', $event ?? null)"
          inputId="eventFromDate"
        />
      </div>
      <div class="flex flex-col gap-1">
        <span class="text-xs text-muted-foreground">Do</span>
        <form-date-picker
          placeholder="Do"
          [value]="this.filters().toDate"
          (onSelection)="setFilter('toDate', $event ?? null)"
          inputId="eventToDate"
        />
      </div>

      <span class="mt-2 font-semibold text-primary text-sm">Data ukończenia</span>
      <div class="flex flex-col gap-1">
        <span class="text-xs text-muted-foreground">Od</span>
        <form-date-picker
          placeholder="Od"
          [value]="this.filters().fromCompletionDate"
          (onSelection)="setFilter('fromCompletionDate', $event ?? null)"
          inputId="completionFromDate"
        />
      </div>
      <div class="flex flex-col gap-1">
        <span class="text-xs text-muted-foreground">Do</span>
        <form-date-picker
          placeholder="Do"
          [value]="this.filters().toCompletionDate"
          (onSelection)="setFilter('toCompletionDate', $event ?? null)"
          inputId="completionToDate"
        />
      </div>
    </div>
  </hlm-popover>

  <!-- Other filters -->
  <hlm-popover>
    <button hlmBtn variant="outline" hlmPopoverTrigger>
      Dodatkowe filtry
      @if (isOtherFilterActive()) {
        <ng-icon name="lucideCheck" class="text-primary" />
      }
    </button>
    <div hlmPopoverContent *hlmPopoverPortal="let ctx" class="w-64 p-3 flex flex-col gap-2">
      <span class="font-semibold text-primary text-sm">Opis</span>
      <filter-search-input
        fieldName="description"
        [value]="this.filters().description"
        placeholder="Szukaj po opisie..."
        (onValueChange)="setFilter('description', $event)"
      />

      <span class="mt-2 font-semibold text-primary text-sm">Lokalizacja</span>
      <filter-search-input
        fieldName="location"
        [value]="this.filters().location"
        placeholder="Szukaj po lokalizacji..."
        (onValueChange)="setFilter('location', $event)"
      />
    </div>
  </hlm-popover>

  <button
    hlmBtn
    variant="secondary"
    (click)="clearAllFilters()"
    class="ms-auto flex items-center justify-center"
  >
    <ng-icon name="lucideFilterX" class="text-white" />
  </button>
</div>

<div class="p-2 mt-2">
  <data-table
    [records]="eventsRecords"
    [columns]="eventsColumns"
    [paginationStore]="paginationStore"
    [rowActions]="actionsMenu"
  />

  <ng-template #actionsMenu let-row>
    <div hlmDropdownMenu class="w-48">
      <button hlmDropdownMenuItem (click)="infoDialogCmp.open(row.id)" variant="primary">
        <ng-icon name="lucideInfo" />
        Szczegóły
      </button>
      <button
        hlmDropdownMenuItem
        (click)="createEditDialogCmp.openEdit(row.id)"
        variant="secondary"
      >
        <ng-icon name="lucideNotebookPen" />
        Edytuj
      </button>
      <hlm-dropdown-menu-separator />

      <!-- Mark as done button -->
      @if (!row.completionDate) {
        <button
          hlmDropdownMenuItem
          (click)="
            markAsDoneDialog.openWithIdAndNameAddition(
              row.id,
              ` &quot;${row.title}&quot; z dnia ${formatEventDate(row.date)}`
            )
          "
          variant="success"
        >
          <ng-icon name="lucideCheckCircle" />
          Oznacz "zrobione"
        </button>
      } @else {
        <button
          hlmDropdownMenuItem
          (click)="
            markAsNotDoneDialog.openWithIdAndNameAddition(
              row.id,
              ` &quot;${row.title}&quot; z dnia ${formatEventDate(row.date)}, zakończonego ${formatEventDate(row.completionDate!)}`
            )
          "
          variant="amber"
        >
          <ng-icon name="lucideXCircle" />
          Oznacz "niezrobione"
        </button>
      }

      <hlm-dropdown-menu-separator />
      <button
        hlmDropdownMenuItem
        (click)="
          deleteDialogCmp.openWithIdAndNameAddition(
            row.id,
            ` &quot;${row.title}&quot; z dnia ${formatEventDate(row.date)}`
          )
        "
        variant="destructive"
      >
        <ng-icon name="lucideTrash2" />
        Usuń
      </button>
    </div>
  </ng-template>

  <div class="mt-3"></div>
  <pagination
    [paginationState]="paginationStore.state()"
    (pageChange)="paginationStore.setPage($event)"
    (pageSizeChange)="paginationStore.setPageSize($event)"
  />
</div>

<custom-event-create-edit-dialog #createEditDialogCmp (refreshList)="refreshList()" />

<delete-confirm-dialog
  #deleteDialogCmp
  elementName="Wydarzenie"
  (onConfirm)="onDelete($event || '')"
/>

<custom-event-info-dialog #infoDialogCmp />

<!-- Confirm completion -->
<confirm-dialog
  #markAsDoneDialog
  variant="success"
  icon="lucideCheck"
  title="Potwierdzenie zakończenia"
  subtitle="oznaczyć jako zakończone"
  buttonText="Zakończ"
  elementName="Wydarzenie"
  (onConfirm)="markAsDone($event || '')"
/>
<confirm-dialog
  #markAsNotDoneDialog
  variant="warning"
  icon="lucideUndo2"
  title="Anulowanie zakończenia"
  subtitle="cofnąć oznaczenie jako zakończone"
  buttonText="Cofnij zakończenie"
  elementName="Wydarzenie"
  (onConfirm)="markAsNotDone($event || '')"
/>
