<div class="bg-white px-2 py-2 flex items-center flex-wrap gap-2">
  <span class="text-muted-foreground">Filtry</span>
  <span class="text-muted-foreground">Daty</span>
  <form-date-picker
    placeholder="Od"
    [value]="this.filters().fromDate"
    (onSelection)="setFilter('fromDate', $event ?? null)"
    [maxDate]="this.filters().toDate ?? undefined"
    inputId="fromDateFilter"
  />
  <span class="text-muted-foreground"> - </span>
  <form-date-picker
    placeholder="Do"
    [value]="this.filters().toDate"
    (onSelection)="setFilter('toDate', $event ?? null)"
    inputId="toDateFilter"
  />
  <button
    hlmBtn
    variant="secondary"
    (click)="clearAllFilters()"
    class="ms-auto flex items-center justify-center"
  >
    <ng-icon name="lucideFilterX" class="text-white" />
  </button>
</div>

<div class="p-2 mt-2">
  <data-table
    [records]="fuelingsRecords"
    [columns]="fuelingColumns"
    [paginationStore]="paginationStore"
    [rowActions]="actionsMenu"
  >
    <div rightToColumnButton class="flex gap-2 align-center items-center">
      <button
        hlmBtn
        variant="success"
        hlmTooltip="Dodaj tankowanie"
        class="flex items-center justify-center"
        (click)="createEditDialogCmp.openCreate()"
      >
        <ng-icon name="lucidePlus" />
      </button>
      <refresh-list-button
        (onRefresh)="refreshList()"
        [isRefreshing]="fuelingsList.status() === 'loading'"
      />
    </div>
  </data-table>

  <ng-template #actionsMenu let-row>
    <div hlmDropdownMenu class="w-48">
      <button hlmDropdownMenuItem (click)="infoDialogCmp.open(row.id)" variant="primary">
        <ng-icon name="lucideInfo" />
        Szczegóły
      </button>
      <button
        hlmDropdownMenuItem
        (click)="createEditDialogCmp.openEdit(row.id)"
        variant="secondary"
      >
        <ng-icon name="lucideNotebookPen" />
        Edytuj
      </button>
      <hlm-dropdown-menu-separator />
      <button
        hlmDropdownMenuItem
        (click)="deleteDialogCmp.openWithIdAndNameAddition(row.id, ` z dnia ${row.date}`)"
        variant="destructive"
      >
        <ng-icon name="lucideTrash2" />
        Usuń
      </button>
    </div>
  </ng-template>

  <div class="mt-3"></div>
  <pagination
    [paginationState]="paginationStore.state()"
    (pageChange)="paginationStore.setPage($event)"
    (pageSizeChange)="paginationStore.setPageSize($event)"
  />
</div>

<delete-confirm-dialog
  #deleteDialogCmp
  elementName="Tankowanie"
  (onConfirm)="onDelete($event || '')"
/>

<vehicle-fueling-for-vehicle-create-edit-dialog
  #createEditDialogCmp
  (refreshList)="refreshList()"
  [vehicleId]="this.vehicleId()"
/>

<vehicle-fueling-info-dialog #infoDialogCmp />
