<hlm-dialog>
  <ng-content></ng-content>

  <hlm-dialog-content *hlmDialogPortal="let ctx" class="sm:max-w-sm md:w-md">
    <form [formGroup]="userForm" (ngSubmit)="submitForm()">
      <hlm-dialog-header>
        <h3 hlmDialogTitle>Utwórz użytkownika</h3>
        <p hlmDialogDescription>Wprowadź dane użytkownika</p>
      </hlm-dialog-header>
      <hlm-field-group>
        <hlm-field>
          <label hlmFieldLabel for="name">Imię i nazwisko</label>
          <input hlmInput id="name" formControlName="name" autocomplete="off" />
          <error-label
            [isDisabled]="userForm.controls.name.invalid && userForm.controls.name.touched"
            message="Imię i nazwisko jest wymagane!"
          />
        </hlm-field>
        <hlm-field>
          <label hlmFieldLabel for="username">Login</label>
          <input hlmInput id="username" formControlName="username" autocomplete="off" />
          <error-label
            [isDisabled]="userForm.controls.username.invalid && userForm.controls.username.touched"
            message="Login jest wymagany!"
          />
        </hlm-field>
        <hlm-field>
          <label hlmFieldLabel for="email">Email</label>
          <input hlmInput id="email" formControlName="email" autocomplete="off" />
          <error-label
            [isDisabled]="userForm.controls.email.invalid && userForm.controls.email.touched"
            [message]="
              userForm.controls.email.errors?.['email']
                ? 'Proszę podać poprawny email!'
                : 'Email jest wymagany!'
            "
          />
        </hlm-field>
        <hlm-field>
          <label hlmFieldLabel for="password">Hasło</label>
          <input hlmInput id="password" formControlName="password" type="password" />
          <error-label
            [isDisabled]="userForm.controls.password.invalid && userForm.controls.password.touched"
            [message]="
              userForm.controls.password.errors?.['minlength']
                ? 'Hasło musi posiadać minimum 5 znaków!'
                : 'Hasło jest wymagane!'
            "
          />
        </hlm-field>
        <hlm-field>
          <label hlmFieldLabel for="confirmPassword">Powtórz hasło</label>
          <input hlmInput id="confirmPassword" formControlName="confirmPassword" type="password" />
          <error-label
            [isDisabled]="
              userForm.controls.confirmPassword.invalid && userForm.controls.confirmPassword.touched
            "
            [message]="
              userForm.controls.confirmPassword.errors?.['passwordsMismatch']
                ? 'Hasła nie są identyczne!'
                : 'Potwierdzenie hasła jest wymagane!'
            "
          />
        </hlm-field>
        <hlm-field>
          <label hlmFieldLabel>Rola</label>
          <form-select
            [items]="rolesSelectOption()"
            [value]="userForm.controls.role.value"
            [isLoading]="false"
            id="role"
            (onSelection)="selectRole($event)"
          />
          <error-label
            [isDisabled]="userForm.controls.role.invalid && userForm.controls.role.touched"
            [message]="'Rola jest wymagana!'"
          />
        </hlm-field>
      </hlm-field-group>
      <hlm-dialog-footer>
        <button hlmBtn variant="outline" hlmDialogClose>Anuluj</button>
        <submit-button
          buttonText="Utwórz"
          [isSubmitting]="isSubmitting()"
          [isDisabled]="(userForm.invalid && userForm.touched) || isSubmitting()"
          variant="success"
        />
      </hlm-dialog-footer>
    </form>
  </hlm-dialog-content>
</hlm-dialog>
