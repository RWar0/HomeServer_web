<section class="flex items-center rounded-xl border border-slate-200 p-5 shadow-sm h-full">
  <div class="flex gap-4 items-center p-4 w-full rounded-xl bg-white shadow-sm">
    <div
      class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-blue-50 text-blue-500"
    >
      <ng-icon name="lucideHouse" class="text-2xl" />
    </div>

    <div class="min-w-0 flex-1">
      @if (isLoading()) {
        <div class="flex items-center justify-center">
          <hlm-spinner class="text-3xl text-primary" />
        </div>
      } @else {
        <div class="font-semibold text-slate-800">{{ getStatusTitle() }}</div>
        <div class="mt-1 text-xs text-slate-400">{{ getTodayTasksDescription() }}</div>
        @if (statusData() && statusData()!.overdueEventsCount > 0) {
          <div class="text-xs text-slate-400">{{ getOverdueTasksDescription() }}</div>
        }
      }
    </div>

    <div class="hidden sm:block">
      <ng-icon
        name="lucideLeaf"
        class="text-4xl"
        [class]="isLoading() ? 'opacity-0' : getStatusColor()"
      />
    </div>
  </div>
</section>
