@if (fileValue()) {
  @if (photoPreview()) {
    <span class="font-semibold -mb-2">{{ fileValue()?.name }}</span>
  }

  <div
    class="relative flex flex-col items-center justify-center gap-4 rounded-lg border-2 border-dashed p-8 transition"
  >
    <div class="absolute right-1 -top-5 z-10 bg-background border-3 border-background">
      <button
        hlmBtn
        hlmTooltip="Usuń zdjęcie"
        (click)="removeFile()"
        variant="destructive"
        size="icon"
        class="rounded-full"
      >
        <ng-icon name="lucideX" class="text-bold" />
      </button>
    </div>
    @if (photoPreview()) {
      <img
        class="max-h-64 w-full object-contain aspect-video"
        [src]="photoPreview()"
        alt="Podgląd zdjęcia do dodania"
      />
    } @else {
      <div class="flex flex-col items-center justify-center">
        <div class="bg-accent/80 p-2 rounded-md border border-gray-300 mb-3">
          <ng-icon name="lucideFilePlus2" class="text-4xl" />
        </div>
        <p class="text-sm font-bold text-gray-700">{{ fileValue()!.name }}</p>
        <p class="text-xs font-medium text-muted-foreground">Rozmiar: {{ fileSize() }}</p>
      </div>
    }
  </div>
} @else {
  <div
    class="flex flex-col items-center justify-center gap-4 rounded-lg border-2 border-dashed p-8 transition"
    [class.border-primary]="isDragging()"
    [class.bg-muted]="isDragging()"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave()"
    (drop)="onDrop($event)"
  >
    <div class="text-center">
      <p class="text-lg font-medium">Przeciągnij {{ fileTypeName() }} tutaj</p>
      <p class="text-sm text-muted-foreground">albo wybierz {{ fileTypeName() }} z komputera</p>
    </div>

    <label class="inline-flex">
      <button hlmBtn variant="outline" type="button" (click)="fileInput.click()">
        <ng-icon name="lucideUpload" /> Wybierz {{ fileTypeName() }}
      </button>
      <input
        #fileInput
        hidden
        type="file"
        [accept]="acceptFormats()"
        (change)="onFileSelected($event)"
      />
    </label>
  </div>
}
