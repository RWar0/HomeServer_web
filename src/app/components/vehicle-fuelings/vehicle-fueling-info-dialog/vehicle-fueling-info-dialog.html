<hlm-dialog>
  <hlm-dialog-content
    *hlmDialogPortal="let ctx"
    class="w-[95vw]! max-w-none! md:max-w-md! lg:max-w-md! xl:max-w-md! max-h-[90vh]"
  >
    <hlm-dialog-header>
      <h3 hlmDialogTitle>Tankowanie pojazdu</h3>
      <p hlmDialogDescription>Szczegóły dotyczące tankowania pojazdu.</p>
    </hlm-dialog-header>

    @if (isLoadingData()) {
      <div class="flex items-center justify-center h-20">
        <hlm-spinner class="text-3xl text-primary" />
      </div>
    } @else {
      <div class="flex flex-col gap-1">
        <labeled-field label="Pojazd" [value]="vehicleFueling?.vehicleName" />
        <labeled-field
          label="Data tankowania"
          [value]="vehicleFueling?.date | date: 'dd.MM.yyyy'"
        />
        <labeled-field label="Ilość" [value]="vehicleFueling?.quantity" unit="L" />
        <labeled-field label="Koszt" [value]="vehicleFueling?.cost | currency: 'PLN' : 'symbol'" />
      </div>
    }
  </hlm-dialog-content>
</hlm-dialog>
